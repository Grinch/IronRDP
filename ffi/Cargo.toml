[package]
name = "ffi"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "ironrdp"
crate-type = ["staticlib", "cdylib"]
doc = false
test = false
doctest = false

[features]
default = ["rdpsnd-native"]
# Plays server audio on the local output device through CPAL (`ClientConnector::with_static_channel_rdp_snd_native`).
# On Linux, CPAL links ALSA, so building needs the ALSA development files (`libasound2-dev`) and `pkg-config`.
rdpsnd-native = ["dep:ironrdp-rdpsnd-native"]

[dependencies]
diplomat = { git = "https://github.com/Devolutions/diplomat", tag = "0.17.0-devo.1" }
diplomat-runtime = { git = "https://github.com/Devolutions/diplomat", tag = "0.17.0-devo.1" }
ironrdp = { path = "../crates/ironrdp", features = ["session", "connector", "dvc", "svc", "rdpdr", "rdpsnd", "graphics", "input", "cliprdr", "displaycontrol", "rdpei"] }
ironrdp-cliprdr-native.path = "../crates/ironrdp-cliprdr-native"
ironrdp-dvc-pipe-proxy.path = "../crates/ironrdp-dvc-pipe-proxy"
ironrdp-core = { path = "../crates/ironrdp-core", features = ["alloc"] }
ironrdp-vmconnect = { path = "../crates/ironrdp-vmconnect" }
ironrdp-rdcleanpath.path = "../crates/ironrdp-rdcleanpath"
sspi = { version = "0.23", features = ["network_client"] }
thiserror = "2"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"

[target.'cfg(windows)'.dependencies]
ironrdp-rdpdr-native.path = "../crates/ironrdp-rdpdr-native"

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
# Opus is left out: its bundled build needs CMake. The server then picks PCM, ADPCM or G.711 (or AAC on Windows).
ironrdp-rdpsnd-native = { path = "../crates/ironrdp-rdpsnd-native", default-features = false, features = ["aac"], optional = true }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"

[lints]
workspace = true
